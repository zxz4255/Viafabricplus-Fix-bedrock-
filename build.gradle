plugins {
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.viaversion.com/everything/' }
    maven { url = 'https://repo.viaversion.com/' }
    maven { url = 'https://maven.lenni0451.net/releases' }
    maven {
        url = 'https://jitpack.io'
        content { includeGroupByRegex "com\\.github\\..+" }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // ViaVersion/ViaLoader are libraries used by the embedded ViaBedrock core.
    // IMPORTANT: use implementation as well as include. Loom's include configuration
    // is non-transitive, so declaring only include would omit ViaVersion API/classes
    // required by ViaBedrock at compile time and runtime.
    implementation "com.viaversion:viaversion-common:5.12.0"
    implementation "com.viaversion:vialoader:4.0.6"

    include "com.viaversion:viaversion-common:5.12.0"
    include "com.viaversion:vialoader:4.0.6"

    include "io.jsonwebtoken:jjwt-api:0.13.0"
    include "io.jsonwebtoken:jjwt-impl:0.13.0"
    include "io.jsonwebtoken:jjwt-gson:0.13.0"

    // Core dependencies used by ViaBedrock itself.
    implementation("io.netty:netty-codec-http:4.2.18.Final") { transitive = false }
    implementation("io.netty:netty-codec-compression:4.2.18.Final") { transitive = false }
    implementation "io.jsonwebtoken:jjwt-api:0.13.0"
    implementation "io.jsonwebtoken:jjwt-impl:0.13.0"
    implementation("io.jsonwebtoken:jjwt-gson:0.13.0") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation("net.lenni0451.mcstructs-bedrock:text:2.0.1") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation("net.lenni0451.mcstructs-bedrock:forms:2.0.1") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation("com.viaversion.mcstructs:dialog:5-3.2.2-20251210.004302-1") {
        exclude group: 'com.viaversion.mcstructs', module: 'core'
        exclude group: 'com.viaversion.mcstructs', module: 'text'
        exclude group: 'com.viaversion.mcstructs', module: 'snbt'
        exclude group: 'com.viaversion.mcstructs', module: 'converter'
    }
    implementation "com.vdurmont:semver4j:3.1.0"
    implementation "at.yawk.lz4:lz4-java:1.11.3"
    // ViaBedrock resource-pack/entity rendering code depends on CubeConverter.
    // This is the same JitPack revision used by upstream ViaBedrock.
    implementation("com.github.oryxel1:CubeConverter:abecffaaea") { transitive = false }
    include("com.github.oryxel1:CubeConverter:abecffaaea") { transitive = false }
    implementation("team.unnamed:mocha:3.0.1") { transitive = false }
    // Cloudburst RakNet is a runtime dependency for direct Bedrock connections.
    // Fabric does not automatically bundle normal implementation dependencies, so
    // package this transport inside the final mod jar.
    implementation("dev.kastle.netty:netty-transport-raknet:1.7.4") {
        transitive = false
    }
    include("dev.kastle.netty:netty-transport-raknet:1.7.4") {
        transitive = false
    }

    // Microsoft/Xbox/Minecraft Bedrock account authentication.
    // MinecraftAuth 5.0.2 is the current maintained Java/Bedrock auth library
    // and supports the Bedrock device-code flow with automatic token refresh.
    implementation("net.raphimc:MinecraftAuth:5.0.2") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    include("net.raphimc:MinecraftAuth:5.0.2") {
        transitive = false
    }
    include("net.lenni0451.commons:httpclient:1.9.2") {
        transitive = false
    }
    include("net.lenni0451.commons:gson:1.9.2") {
        transitive = false
    }

    // Minecraft already provides these at runtime; they are compile-only here to
    // avoid duplicating Minecraft's own copies inside the mod.
    compileOnly "org.yaml:snakeyaml:2.7"
    compileOnly "com.google.guava:guava:33.7.1-jre"
    compileOnly "com.google.code.gson:gson:2.14.0"
    compileOnly "io.netty:netty-handler:4.2.18.Final"
    // Brigadier is already part of Minecraft 26.2.
    compileOnly "com.mojang:brigadier:1.3.10"
}


// Loom's include configuration is intentionally non-transitive. The embedded
// ViaVersion/ViaLoader dependencies themselves depend on the ViaVersion API and
// other libraries, so collect their resolved transitive runtime artifacts into
// nested jars. This keeps the final Fabric mod self-contained without using
// ViaFabricPlus or ViaProxy.
configurations {
    viabedrockBundle
}

dependencies {
    viabedrockBundle "com.viaversion:viaversion-common:5.12.0"
    viabedrockBundle "com.viaversion:vialoader:4.0.6"
}

tasks.register('prepareViaBedrockBundle') {
    doLast {
        configurations.viabedrockBundle.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            // Include only external runtime libraries. Minecraft/Fabric itself must
            // never be nested in the mod.
            if (id.group != 'com.mojang' && id.group != 'net.fabricmc') {
                dependencies.add('include', "${id.group}:${id.name}:${id.version}")
            }
        }
    }
}

tasks.named('jar') {
    dependsOn 'prepareViaBedrockBundle'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Publish locally when needed; CI only builds the jar.
        mavenLocal()
    }
}
